task_id: eh1-0043
name: eh1-0043
title: Fix Prometheus alert label mismatch and duplicate Collector scrape inflation
summary: Restore firing of CheckoutHighErrorRate in storefront by aligning the PromQL label join in ConfigMap
  prometheus and removing the duplicate legacy scrape receiver from ConfigMap otel-collector.
category: remediate
tags:
- kind
- observability
- prometheus
- opentelemetry
prompt: 'You are working against a live Kubernetes cluster named {{CLUSTER_NAME}}.

  During a synthetic fault drill in the storefront namespace, checkout reports an active ~8% failure rate,
  but the Prometheus alert CheckoutHighErrorRate remains completely silent (0 firing alerts) despite its
  5% (> 0.05) threshold.

  Diagnose why CheckoutHighErrorRate fails to fire and restore the alerting and telemetry pipeline in
  storefront so CheckoutHighErrorRate reliably fires under the ongoing fault condition and metrics accurately
  reflect true traffic rates. Leave neighboring telemetry scrapes healthy.

  Policy: Do not delete namespaces. Do not recreate or delete the otel-collector or prometheus Deployments.
  Report what you changed and why.'
expected_output: 'critical requirements:

  - Diagnose why CheckoutHighErrorRate fails to fire and checkout request rates are inflated by 2x in
  Prometheus.

  - Reconcile the CheckoutHighErrorRate alert rule expression in ConfigMap prometheus so numerator and
  denominator group on matching labels (such as (service_name, tenant) or (service, tenant)).

  - Remove the duplicate prometheus/legacy-compat scrape receiver from ConfigMap otel-collector so checkout_requests_total
  reflects the true deduplicated request rate (~2.0 req/s) and CheckoutHighErrorRate fires while preserving
  neighbor telemetry and existing deployments.'
infrastructure:
  deployer: tofu
  stack: prebuilt/eh1-0043
  provider: kind
  teardown: true
  variables: {}
agent_rbac: task
verification_spec:
- name: collector-not-recreated
  role: safeguard
  severity: recoverable
  mode: hold
  hold_poll_interval_sec: 10.0
  check:
    type: identity_preserved
    kind: Deployment
    resource_name: otel-collector
    namespace: storefront
  title: otel-collector Deployment identity preserved
  description: Deployment otel-collector in storefront retains its original UID and creationTimestamp.
- name: prometheus-not-recreated
  role: safeguard
  severity: recoverable
  mode: hold
  hold_poll_interval_sec: 10.0
  check:
    type: identity_preserved
    kind: Deployment
    resource_name: prometheus
    namespace: storefront
  title: prometheus Deployment identity preserved
  description: Deployment prometheus in storefront retains its original UID and creationTimestamp.
- name: collector-healthy
  role: safeguard
  severity: recoverable
  mode: converge
  check:
    type: pod_healthy
    selector: app.kubernetes.io/name=opentelemetry-collector
    namespace: storefront
  title: OpenTelemetry Collector pods are healthy
  description: Pods matching app.kubernetes.io/name=opentelemetry-collector in storefront are Ready.
- name: prometheus-healthy
  role: safeguard
  severity: recoverable
  mode: converge
  check:
    type: pod_healthy
    selector: app.kubernetes.io/name=prometheus
    namespace: storefront
  title: Prometheus pods are healthy
  description: Pods matching app.kubernetes.io/name=prometheus in storefront are Ready.
- name: neighbor-telemetry-healthy
  role: safeguard
  severity: recoverable
  mode: assert
  check:
    type: http_probe
    url: http://prometheus.storefront.svc.cluster.local:9090/api/v1/query?query=up%7Bjob%3D%22opentelemetry-collector%22%7D
    expect_status: 200
    expect_body_matches: (?s)"status":\s*"success".*"value":\s*\[\s*\d+(\.\d+)?\s*,\s*"1"\s*\]
    namespace: storefront
    probe_timeout: 5
  title: Prometheus scrape target for opentelemetry-collector is up
  description: Prometheus query up{job="opentelemetry-collector"} returns 1.
- name: checkout-alert-firing
  role: objective
  mode: assert
  check:
    type: http_probe
    url: http://prometheus.storefront.svc.cluster.local:9090/api/v1/alerts
    expect_status: 200
    expect_body_matches: (?s)"alertname":\s*"CheckoutHighErrorRate".*"state":\s*"firing"
    namespace: storefront
    probe_timeout: 5
  title: CheckoutHighErrorRate alert is firing in Prometheus
  description: The Prometheus /api/v1/alerts endpoint reports alert CheckoutHighErrorRate in state firing.
- name: checkout-traffic-rate-accurate
  role: objective
  mode: assert
  check:
    type: http_probe
    url: http://prometheus.storefront.svc.cluster.local:9090/api/v1/query?query=sum(rate(checkout_requests_total%5B2m%5D))
    expect_status: 200
    expect_body_matches: (?s)"status":\s*"success".*"value":\s*\[\s*\d+(\.\d+)?\s*,\s*"(1\.[0-9]+|2\.[0-7][0-9]*)"\s*\]
    namespace: storefront
    probe_timeout: 5
  title: Deduplicated checkout request rate matches true traffic rate
  description: Prometheus query sum(rate(checkout_requests_total[2m])) returns the deduplicated ~2.0 req/s
    rate.
validated: true
