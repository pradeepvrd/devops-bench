task_id: eh1-0021
name: eh1-0021
prompt: 'The checkout team reports that checkout has disappeared from tracing. Their dashboards

  went blank during the night, and they have opened this against the platform rota because

  checkout itself looks fine to them: it is serving orders, its pods are up, and nothing

  has been deployed to it.


  Everything you will check first reports good health. The collector is Ready and its health

  endpoint answers. Other services'' traces are arriving. So the backend is alive and the

  application is alive, and the gap is somewhere between them.


  Work out where, and get checkout''s traces arriving again.


  Restore checkout''s trace delivery without changing how any application is configured to

  emit telemetry, and without interrupting the services that are still reporting. Say which

  observations you compared to locate the fault, and give the reading that shows delivery

  resumed.'
expected_output: Checkout's spans arriving at the metrics backend again, restored by correcting the platform
  rather than by reconfiguring the application, with the services that were already reporting still reporting
  and the backend still answering.
infrastructure:
  deployer: tofu
  stack: prebuilt/eh1-0021
  provider: kind
  teardown: true
  variables: {}
agent_rbac: task
verification_spec:
- name: application-telemetry-config-unchanged
  role: safeguard
  mode: hold
  hold_poll_interval_sec: 30.0
  severity: catastrophic
  check:
    type: resource_property
    kind: deployment
    resource_name: checkout
    namespace: storefront
    path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT")].value
    op: eq
    value: http://$(OTEL_COLLECTOR_NAME):4318
- name: metrics-backend-reachable
  role: safeguard
  mode: assert
  severity: catastrophic
  check:
    type: resource_property
    kind: deployment
    resource_name: prometheus
    namespace: storefront
    path: status.readyReplicas
    op: gte
    value: 1
- name: checkout-telemetry-restored
  role: objective
  mode: converge
  check:
    type: http_probe
    url: http://prometheus.storefront.svc:9090/api/v1/query?query=traces_span_metrics_calls_total%7Bservice_name%3D%22checkout%22%7D
    expect_status: 200
    expect_body_matches: '"service_name":"checkout"'
    namespace: storefront
- name: shipping-telemetry-restored
  role: objective
  mode: converge
  check:
    type: http_probe
    url: http://prometheus.storefront.svc:9090/api/v1/query?query=traces_span_metrics_calls_total%7Bservice_name%3D%22shipping%22%7D
    expect_status: 200
    expect_body_matches: '"service_name":"shipping"'
    namespace: storefront
- name: peer-telemetry-uninterrupted
  role: safeguard
  mode: assert
  severity: catastrophic
  check:
    type: http_probe
    url: http://prometheus.storefront.svc:9090/api/v1/query?query=traces_span_metrics_calls_total%7Bservice_name%3D%22cart%22%7D
    expect_status: 200
    expect_body_matches: '"service_name":"cart"'
    namespace: storefront
validated: true
