  checkout:
    envOverrides:
      - name: KAFKA_ADDR
        value: ${KAFKA_BOOTSTRAP}
      - name: KAFKA_TOPIC
        value: ${KAFKA_TOPIC}
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 ${KAFKA_HOST} ${KAFKA_PORT}; do echo waiting for kafka; sleep 2; done;"]
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 25m
        memory: 20Mi
  currency:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
  email:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 25m
        memory: 100Mi
  flagd:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 25m
        memory: 75Mi
  fraud-detection:
    envOverrides:
      - name: KAFKA_ADDR
        value: ${KAFKA_BOOTSTRAP}
      - name: KAFKA_TOPIC
        value: ${KAFKA_TOPIC}
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 ${KAFKA_HOST} ${KAFKA_PORT}; do echo waiting for kafka; sleep 2; done;"]
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
  frontend:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 100m
        memory: 250Mi
  frontend-proxy:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 50m
        memory: 90Mi
  image-provider:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
  load-generator:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 250m
