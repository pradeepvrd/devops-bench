# GKE-lane overrides for the opentelemetry-demo chart.
#
# Deploys the full demo (all ~27 components, including jaeger,
# prometheus, grafana and opensearch) with honest resource requests so
# the scheduler and Node Auto-Provisioning behave sanely. The chart's
# stock values.yaml only sets memory limits, no requests, so every
# component below adds a requests block without touching the limits
# already defined upstream (Helm deep-merges maps, so this only adds
# the `requests` key alongside the chart's existing `limits` key).
#
# cpu requests are sized by rough judgment (idle Go/Node/.NET services
# get 10-25m, services that do real per-request work get 50-100m,
# jaeger/prometheus/opensearch get more). memory requests equal
# the chart's existing memory limits, since that's the one number we
# actually have evidence for.
#
# ${NS}, ${SYSTEM}, ${KAFKA_BOOTSTRAP}, ${KAFKA_HOST}, ${KAFKA_PORT}, and
# ${KAFKA_TOPIC} below are filled in at deploy time by stack.sh's
# render_values step (envsubst against a restricted variable allowlist, so
# the chart's own `$(OTEL_COLLECTOR_NAME)` Kubernetes env var expansion
# syntax elsewhere in this file and in values-common.yaml is never touched).
# This file itself is never edited in place; stack.sh copies it into a temp
# dir before substituting. See README.md.
#
# Multi-instance note: three of this chart's subcharts (grafana, prometheus,
# opentelemetry-collector) create cluster-scoped RBAC objects
# (ClusterRole/ClusterRoleBinding) with fixed, non-release-scoped names by
# default, which collide across two otel-demo helm releases in the same
# cluster (confirmed live: a second `up gke` failed with "ClusterRole
# grafana-clusterrole ... exists" against the pre-existing otel-demo
# release). Each subchart's independent RBAC-naming knob is used below to
# make these unique per $NS without touching the Service/Deployment names
# those subcharts and other components reference by their stock, unqualified
# name (e.g. `http://otel-collector:4318`, `http://prometheus:9090`):
# grafana's sidecars only ever need to watch ConfigMaps in their own
# namespace, so `grafana.rbac.namespaced: true` swaps its ClusterRole/
# ClusterRoleBinding for a namespace-scoped Role/RoleBinding (no collision
# possible, since those are namespaced objects); prometheus and
# opentelemetry-collector both expose a dedicated override key for just the
# ClusterRole/ClusterRoleBinding name
# (`prometheus.server.clusterRoleNameOverride`,
# `opentelemetry-collector.clusterRole.name` /
# `.clusterRole.clusterRoleBinding.name`), so only that name is suffixed
# with $NS.
#
# A second, separate collision showed up once RBAC was fixed: this chart's
# opentelemetry-collector defaults to `mode: daemonset`, which schedules one
# collector pod per node with hostPort bound for otlp/otlp-http/jaeger-*/
# zipkin. hostPort is a node-level claim, not namespace-scoped, so a second
# release's daemonset pods went Pending ("didn't have free ports") on any
# node already running the pre-existing otel-demo release's collector
# daemonset. Worse, even after nulling hostPort out, daemonset pods are
# pinned (via per-pod nodeAffinity to an exact, already-existing node name)
# to every node in the cluster, so NAP cannot add capacity for them the way
# it does for ordinary Deployments: on this cluster's e2-standard-2 nodes,
# several were already at 92-99% cpu/memory request from the pre-existing
# otel-demo release's own daemonset pods plus both releases' regular
# components, leaving no room for a second 100m/400Mi daemonset pod on
# those specific nodes, and no amount of waiting fixes a pod that can only
# ever be satisfied by a specific already-full node.
#
# Fixed by setting `opentelemetry-collector.mode: deployment` below: this
# stack doesn't need per-node collection anyway (no component sends
# telemetry via hostPort; everything reaches the collector through the
# ClusterIP Service via $(OTEL_COLLECTOR_NAME), and config.receivers below
# only defines otlp). A single Deployment pod schedules like any other
# demo component, so NAP handles it exactly like it handles the other ~24.
# Deviation to be aware of: the hostMetrics/kubeletMetrics/clusterMetrics
# presets (enabled by default further down) still work in Deployment mode,
# but only observe the one node the pod happens to land on, not the whole
# cluster, since there's no longer a pod on every node. The
# ports.*.hostPort nulling below is kept as a harmless no-op safety net in
# case mode ever reverts to daemonset (isAgent, and therefore hostPort
# rendering, is only true in that mode).
#
# Every component's podLabels below adds the two living-stack labels
# (living-stack=$SYSTEM, living-stack-component=storefront) to that
# component's pod template without touching its Deployment/StatefulSet
# selector, using each (sub)chart's own supported labeling mechanism:
# `components.<name>.podLabels` for the demo's own components (chart's
# `templates/_objects.tpl`), `jaeger.jaeger.podLabels`,
# `prometheus.server.podLabels`, `grafana.podLabels`, and
# `opentelemetry-collector.podLabels` for those subcharts, and
# `opensearch.labels` (opensearch's subchart has no separate podLabels key;
# `labels` is merged into both the StatefulSet's own metadata and its pod
# template via the `opensearch.labels` helper, and is never included in
# `opensearch.selectorLabels`, so it does not touch the selector either).

# The order flow (checkout -> orders topic -> accounting/fraud-detection)
# runs on the shared streaming/ Strimzi Kafka bus instead of the chart's
# bundled single-node kafka. See README.md for the full story. This uses
# the chart's supported `envOverrides` upsert mechanism
# (templates/_pod.tpl, otel-demo.envOverriden) so only KAFKA_ADDR and
# KAFKA_TOPIC are touched per component, rather than reproducing each
# component's whole `env` list. The `wait-for-kafka` initContainers
# hardcode the kafka hostname/port in their nc command (not templated off
# KAFKA_ADDR), so those are overridden too, wholesale, to point at
# ${KAFKA_HOST}/${KAFKA_PORT}.
components:
  kafka:
    # Bundled single-node kafka disabled; no resources block needed since
    # this component no longer deploys.
    enabled: false
  accounting:
    envOverrides:
      - name: KAFKA_ADDR
        value: ${KAFKA_BOOTSTRAP}
      - name: KAFKA_TOPIC
        value: ${KAFKA_TOPIC}
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 ${KAFKA_HOST} ${KAFKA_PORT}; do echo waiting for kafka; sleep 2; done;"]
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 25m
        memory: 160Mi
  ad:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
  agent:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  astronomy-db:
