opentelemetry-collector:
  # Only the cluster-scoped RBAC object names are made unique per $NS; the
  # Service/Deployment stay named "otel-collector" (referenced elsewhere via
  # the $(OTEL_COLLECTOR_NAME) env var and a few hardcoded endpoints). See
  # the multi-instance note above.
  clusterRole:
    name: otel-collector-${NS}
    clusterRoleBinding:
      name: otel-collector-${NS}
  # See the multi-instance note above: mode: deployment avoids the
  # daemonset-per-node scheduling/resource problem entirely for this
  # stack, which never needs hostPort-based collection.
  mode: deployment
  # Belt-and-suspenders: harmless no-op in deployment mode (isAgent is only
  # true for the daemonset template), kept in case mode ever reverts to
  # daemonset.
  ports:
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
    jaeger-compact:
      hostPort: null
    jaeger-thrift:
      hostPort: null
    jaeger-grpc:
      hostPort: null
    zipkin:
      hostPort: null
  podLabels:
    living-stack: ${SYSTEM}
    living-stack-component: storefront
  resources:
    requests:
      cpu: 100m
      memory: 400Mi

jaeger:
  jaeger:
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 100m
        memory: 600Mi

prometheus:
  server:
    # Only the cluster-scoped ClusterRole/ClusterRoleBinding name is made
    # unique per $NS; the Service/Deployment stay named "prometheus" (its
    # stock fullnameOverride, referenced elsewhere e.g. by grafana's
    # datasource config). See the multi-instance note above.
    clusterRoleNameOverride: prometheus-${NS}
    # Chart's stock 400Mi memory limit OOMKilled this container repeatedly
    # in practice (observed working set ~343Mi immediately before an
    # OOMKill, so 400Mi left almost no headroom). Raised to 800Mi (limit
    # and request) for real headroom. 800Mi still proved insufficient
    # under actual sustained load in this environment (143 restarts,
    # repeated OOMKills, working set exceeding the limit during WAL
    # segment loading), so raised again to 1Gi (limit and request).
    podLabels:
      living-stack: ${SYSTEM}
      living-stack-component: storefront
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1Gi

grafana:
  # Sidecars only ever need to watch ConfigMaps in their own namespace, so
  # this swaps the ClusterRole/ClusterRoleBinding for a namespace-scoped
  # Role/RoleBinding, which needs no cross-release-unique name. See the
  # multi-instance note above.
  rbac:
    namespaced: true
  podLabels:
    living-stack: ${SYSTEM}
    living-stack-component: storefront
  resources:
    requests:
      cpu: 50m
      memory: 300Mi
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi

opensearch:
  labels:
    living-stack: ${SYSTEM}
    living-stack-component: storefront
  resources:
    requests:
      cpu: 200m
      memory: 1100Mi
